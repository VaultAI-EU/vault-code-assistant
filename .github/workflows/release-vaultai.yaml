name: VaultAI Release

# Triggered when a tag matching v*-vaultai is pushed
on:
  push:
    tags:
      - 'v*-vaultai'

jobs:
  build-and-release:
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Build VS Code extension
        uses: ./.github/actions/build-vscode-extension
        with:
          platform: darwin
          arch: arm64
          npm_config_arch: arm64
          pre-release: false
          commit-sha: ${{ github.sha }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get tag name
        id: tag_name
        run: echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Rename VSIX for VaultAI
        run: |
          cd extensions/vscode
          VSIX_FILE=$(ls continue-*.vsix | head -n1)
          NEW_NAME="vaultai-assistant-${GITHUB_REF#refs/tags/v}.vsix"
          mv "$VSIX_FILE" "$NEW_NAME"
          echo "VSIX_NAME=$NEW_NAME" >> $GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: VaultAI Code Assistant ${{ steps.tag_name.outputs.TAG }}
          body: |
            # VaultAI Code Assistant ${{ steps.tag_name.outputs.TAG }} 🚀
            
            Fork de Continue.dev avec branding VaultAI et support AWS Bedrock.
            
            ## ✨ Nouveautés
            
            - ✅ Branding VaultAI complet (logo, nom, URLs)
            - ✅ Support AWS Bedrock avec modèles Claude & Llama
            - ✅ Modèles régionaux (EU/US) pour AWS Bedrock
            - ✅ Fix Anthropic API (empty text blocks)
            - ✅ GUI customisée VaultAI
            
            ## 📦 Installation
            
            **Télécharge le fichier `.vsix` ci-dessous:**
            
            1. Clique sur le fichier `.vsix` dans les Assets
            2. Dans VS Code: `Cmd+Shift+P` → `Extensions: Install from VSIX...`
            3. Sélectionne le fichier téléchargé
            4. Recharge VS Code
            
            ⚠️ **Note:** Ignore les fichiers "Source code" - ils sont ajoutés automatiquement par GitHub.
            
            ## 🔧 Configuration AWS Bedrock
            
            Après installation, configure AWS Bedrock:
            - Region: `eu-west-3` (ou ta région)
            - Profile: `bedrock` (de ~/.aws/credentials)
            - Access Key/Secret: optionnels
          files: extensions/vscode/*.vsix
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

